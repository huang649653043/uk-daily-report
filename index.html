<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英国每日热点日报 · Top10</title>
<meta name="description" content="英国每日 Top 10 热点：来源、事件分析与家庭清洁产品内容推广结合点（A4 一页版）">
<style>
:root{
  --bg:#eef1f8; --card:#ffffff; --ink:#141a2b; --muted:#66708a;
  --line:#e3e8f3; --red:#e0384f; --blue:#012169; --bar:#f1f4fb;
}
html.dark{
  --bg:#0b1020; --card:#141b31; --ink:#eef1fa; --muted:#9aa5c0;
  --line:#232c47; --bar:#1c2440;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;font-size:13px;
  transition:background .3s,color .3s;
}
.wrap{max-width:860px;margin:0 auto;padding:10px 12px 90px}
/* ---------- hero (compact) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:16px;color:#fff;
  background:linear-gradient(135deg,var(--blue) 0%,#1e40af 55%,#c8102e 175%);
  padding:14px 16px;box-shadow:0 10px 26px rgba(1,33,105,.22);
}
.hero::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:#3b82f6;filter:blur(50px);opacity:.5;top:-80px;right:-40px;animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(18px,-12px) scale(1.1)}}
.hero-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hero-actions{display:flex;align-items:center;gap:6px}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:700;letter-spacing:1px}
.live i{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.7)}70%{box-shadow:0 0 0 8px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.datepick{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700}
.datepick select{background:transparent;border:none;color:#fff;font-size:10.5px;font-weight:800;outline:none;cursor:pointer}
.datepick select option{color:#141a2b}
.theme-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer}
.hero h1{position:relative;z-index:1;font-size:21px;font-weight:900;letter-spacing:.5px;margin-top:8px;line-height:1.2}
.hero h1 .grad{background:linear-gradient(90deg,#fff,#ffe6ea);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .meta{position:relative;z-index:1;font-size:11.5px;opacity:.94;margin-top:6px}
.hero .meta b{font-weight:800}
.hero .focus{position:relative;z-index:1;margin-top:8px;font-size:10.5px;background:rgba(255,255,255,.13);border-radius:8px;padding:4px 9px;display:inline-block;color:#ffeef0}
/* ---------- ticker (keep) ---------- */
.ticker{
  overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px;
  margin:8px 0 10px;padding:6px 0;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(20,30,60,.05);
}
.ticker .lab{flex:none;font-size:10px;font-weight:800;color:var(--red);background:#fdecef;border-radius:6px;padding:3px 8px;margin-left:8px;letter-spacing:1px}
.ticker .track{display:flex;white-space:nowrap;animation:roll 36s linear infinite;will-change:transform}
.ticker:hover .track{animation-play-state:paused}
.ticker .track span{font-size:11.5px;color:var(--muted);padding-right:26px}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ---------- section ---------- */
section{margin-top:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-head h2{font-size:15px;font-weight:900;letter-spacing:.5px}
.sec-head h2 em{font-style:normal;background:linear-gradient(90deg,var(--red),#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sec-head span{font-size:9.5px;color:var(--muted);font-weight:600;letter-spacing:1.5px}
/* ---------- top10 grid ---------- */
.hotgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.hotgrid{grid-template-columns:1fr 1fr}}
.hotcard{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 11px 8px;box-shadow:0 3px 10px rgba(20,30,60,.05);overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.hotcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,30,60,.1)}
.hotcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rankc,#2563eb)}
.hotcard.top1::before,.hotcard.top2::before,.hotcard.top3::before{background:linear-gradient(180deg,#f59e0b,#e0384f)}
.rank{position:absolute;right:8px;top:2px;font-size:38px;font-weight:900;line-height:1;color:var(--bar);z-index:0}
.hotcard.top1 .rank,.hotcard.top2 .rank,.hotcard.top3 .rank{color:transparent;-webkit-text-stroke:1px #f59e0b;opacity:.5}
.body{position:relative;z-index:1}
.rankline{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.rk{flex:none;width:19px;height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:var(--rankc,#2563eb)}
.hotcard.top1 .rk{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
.hotcard.top2 .rk{background:linear-gradient(135deg,#94a3b8,#64748b)}
.hotcard.top3 .rk{background:linear-gradient(135deg,#d97706,#b45309)}
.heat{font-size:9.5px;font-weight:800;color:var(--red);background:#fdecef;border-radius:999px;padding:2px 7px;letter-spacing:.3px}
.badge{flex:none;font-size:9px;font-weight:800;color:#fff;border-radius:5px;padding:2px 6px;letter-spacing:.3px}
.badge.tiktok{background:linear-gradient(135deg,#fe2c55,#25f4ee)}
.badge.google{background:linear-gradient(135deg,#4285f4,#34a853)}
.badge.reddit{background:linear-gradient(135deg,#ff4500,#ff8717)}
.badge.bbc,.badge.news{background:linear-gradient(135deg,#012169,#3b82f6)}
.src{margin-left:auto;font-size:9.5px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.title{font-size:13.5px;font-weight:800;line-height:1.35;margin:2px 0 5px;padding-right:22px}
.hbar{height:4px;border-radius:99px;background:var(--bar);overflow:hidden;margin-bottom:6px}
.hbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--rankc,#2563eb),#f59e0b);transition:width 1s cubic-bezier(.22,1,.36,1)}
.blk{font-size:11.5px;margin-bottom:4px}
.blk .lab{font-weight:800;color:var(--blue);display:inline}
html.dark .blk .lab{color:#8ab4ff}
.promo{font-size:11.5px;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(224,56,79,.08));border:1px dashed rgba(224,56,79,.4);border-radius:8px;padding:4px 7px;margin-top:3px}
.promo .lab{color:var(--red);display:inline}
/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);z-index:60;
  background:rgba(20,26,43,.92);color:#fff;font-size:11.5px;font-weight:700;
  padding:8px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);
  transition:transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;
}
.toast.show{transform:translate(-50%,0)}
/* ---------- footer ---------- */
footer{margin-top:12px;color:var(--muted);font-size:10px;text-align:center;line-height:1.6}
/* ---------- floating bar ---------- */
.fbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;
}
.fbar .hint{flex:1;font-size:10.5px;color:var(--muted)}
.fbar button{border:none;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer}
.fbar .copy{background:linear-gradient(135deg,#c8102e,#e0384f);color:#fff}
.fbar .print{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
/* ---------- A4 print: one page ---------- */
@media print{
  @page{size:A4;margin:7mm}
  html,body{background:#fff}
  .wrap{max-width:none;padding:0}
  .hero{border-radius:0;box-shadow:none;padding:10px 12px}
  .hotgrid{grid-template-columns:1fr 1fr;gap:6px}
  .hotcard{box-shadow:none;break-inside:avoid;margin:0}
  .fbar{display:none}
  .theme-btn,.datepick{display:none}
  section{margin-top:8px}
  .sec-head{margin-bottom:5px}
}
@media (max-width:480px){.hero h1{font-size:18px}.title{font-size:12.5px}}
</style>
</head>

    var rc = PAGE.rankColors[i % PAGE.rankColors.length];
    var top = i<3 ? ' top'+(i+1) : '';
    var badge = it.badge ? '<span class="badge ' + esc(it.platform||'news') + '">' + esc(it.badge) + '</span>' : '';
    hot += '<article class="hotcard reveal' + top + '" style="--rankc:' + rc + '">' +
      '<span class="rank">' + String(i+1).padStart(2,'0') + '</span>' +
      '<div class="body">' +
        '<div class="rankline"><span class="rk">' + (i+1) + '</span>' + badge +
          '<span class="heat">🔥 ' + esc(it.heat) + '</span>' +
          (it.source ? '<a class="src" href="' + esc(it.sourceUrl||'#') + '" target="_blank" rel="noopener">' + esc(it.source) + ' ↗</a>' : '') +
        '</div>' +
        '<div class="title">' + esc(it.title) + '</div>' +
        '<div class="hbar"><i data-w="' + it.heatLevel + '"></i></div>' +
        '<div class="blk"><span class="lab">📌 分析：</span>' + esc(it.analysis) + '</div>' +
        '<div class="blk promo"><span class="lab">🧽 推广：</span>' + esc(it.promotion) + '</div>' +
      '</div></article>';
  });
  document.getElementById('hotList').innerHTML = hot;
  document.getElementById('foot').innerHTML =
    '<b>' + esc(m.title) + '</b> · ' + esc(m.date) + ' ｜ 每日 10:00（伦敦时间）自动更新 ｜ ' + esc(m.note) + '<br>' + esc(m.promotionBase);
  observeReveals();
  animateBars();
}
function observeReveals(){
  var els = document.querySelectorAll('.reveal');
  if(typeof IntersectionObserver === 'undefined'){ for(var i=0;i<els.length;i++){ els[i].classList.add('in'); } return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.1});
  for(var j=0;j<els.length;j++){ io.observe(els[j]); }
}
function animateBars(){
  var bars = document.querySelectorAll('.hbar i');
  setTimeout(function(){
    for(var i=0;i<bars.length;i++){
      var w = bars[i].getAttribute('data-w') || 50;
      bars[i].style.width = w + '%';
      bars[i].style.background = 'linear-gradient(90deg,' + heatColor(+w) + ',#f59e0b)';
    }
  },120);
}
function copyText(){
  var d = PAGE.data, m = d.meta;
  var lines = ['《' + m.title + '》 ' + m.date + '（' + m.weekday + '）','数据抓取时间：' + m.captureTimeLondon,''];
  d.top10.forEach(function(it, i){
    lines.push((i+1) + '. ' + it.title + '｜' + it.heat + '｜来源：' + it.source);
    lines.push('   事件分析：' + it.analysis);
    lines.push('   内容推广结合点：' + it.promotion);
    lines.push('');
  });
  lines.push('—— ' + m.title + ' · 每日 10:00（伦敦时间）自动更新 ——');
  var txt = lines.join('\n');
  function done(){ var b = document.getElementById('copyBtn'); b.textContent = '✅ 已复制'; setTimeout(function(){ b.textContent = '📋 复制全文'; }, 1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
(function(){
  var btn = document.getElementById('copyBtn');
  if(btn){ btn.addEventListener('click', copyText); }
  var sel = document.getElementById('dateSel');
  sel.addEventListener('change', function(){ loadDate(sel.value); });
  var th = document.getElementById('themeBtn');
  th.addEventListener('click', function(){
    var dark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', dark);
    th.textContent = dark ? '☀️ 浅色' : '🌙 深色';
    try{ localStorage.setItem('ukrr-dark', dark?'1':'0'); }catch(e){}
  });
  try{
    if(localStorage.getItem('ukrr-dark')==='1'){ document.documentElement.classList.add('dark'); th.textContent = '☀️ 浅色'; }
  }catch(e){}
})();
</script>
</body>
</html>
